services:
  db:
    image: postgres:17
    container_name: java-bank-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - java-bank-data:/var/lib/postgresql/data

volumes:
  java-bank-data: